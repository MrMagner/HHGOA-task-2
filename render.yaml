services:
  - type: web
    name: voice-rag-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python -c 'from fastembed import TextEmbedding; TextEmbedding(\"sentence-transformers/all-MiniLM-L6-v2\", threads=1, cache_dir=\"./.fastembed_cache\")'"
    startCommand: "PYTHONPATH=. python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/v1/health"
    envVars:
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: VECLIB_MAXIMUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: STT_PROVIDER
        value: sarvam
      - key: LLM_PROVIDER
        value: groq
      - key: DEMO_MODE
        value: "False"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: "sentence-transformers/all-MiniLM-L6-v2"
