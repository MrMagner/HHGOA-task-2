services:
  - type: web
    name: voice-rag-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "PYTHONPATH=. uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: STT_PROVIDER
        value: sarvam
      - key: LLM_PROVIDER
        value: groq
      - key: DEMO_MODE
        value: "False"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
